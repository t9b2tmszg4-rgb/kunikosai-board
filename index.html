<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文化祭ポータル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダー（タイトル部分） -->
    <header>
        <h1> 文化祭 準備ポータル</h1>
        <p>生徒・委員会専用の連絡・管理掲示板サイト</p>
    </header>

    <!-- メインコンテンツ -->
    <main class="container">
        
        <!-- お知らせ・予定掲示板 -->
        <section class="card">
            <h2>準備スケジュール・お知らせ</h2>
            <ul>
                <li><strong>10/25:</strong> 物品の最終申請締め切り</li>
                <li><strong>10/28:</strong> 全体打ち合わせ（放課後・体育館）</li>
                <li><strong>11/02:</strong> 前日準備・会場設営</li>
            </ul>
        </section>

        <!-- メニュー一覧 -->
        <section class="menu-grid">
            <div class="menu-item">
                <h3>在庫・物品管理</h3>
                <p>備品や資材の確認・申請</p>
                <button>開く</button>
            </div>

            <div class="menu-item">
                <h3>出席・シフト確認</h3>
                <p>当日の受付・準備のシフト</p>
                <button>開く</button>
            </div>

            <div class="menu-item">
                <h3>チャット</h3>
                <p>実行委員・各クラスとの連絡</p>
                <button>開く</button>
            </div>
        </section>

    </main>

</body>
</html>
